<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>form-create 导航配置示例</title>
    <!-- 引入 Element Plus 样式 -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3"></script>
    <!-- 引入 Element Plus 组件库 -->
    <script src="https://unpkg.com/element-plus"></script>
    <!-- 引入 form-create element-ui 版 (Vue3) -->
    <script src="https://unpkg.com/@form-create/element-ui@next"></script>
</head>
<body>
    <div id="app">
        <div style="padding: 20px; max-width: 800px; margin: 0 auto;">
            <h3>导航项配置管理</h3>
            <!-- form-create 组件 -->
            <form-create
                v-model:api="fApi"
                v-model="formData"
                :rule="rule"
                :option="option"
                @on-submit="onSubmit"
            ></form-create>
            
            <div style="margin-top: 20px;">
                <strong>当前表单数据：</strong>
                <pre>{{ formData }}</pre>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive } = Vue;

        const app = createApp({
            setup() {
                // 1. 实例 API 对象，用于动态操作表单
                const fApi = ref({});
                // 2. 表单双向绑定的数据对象
                const formData = ref({});

                // 3. 定义 Rule (规则) - 这就是你问的核心部分
                const rule = ref([
                    {
                        type: 'input',
                        field: 'nav_name',
                        title: '导航名称',
                        value: '首页',
                        props: { placeholder: '请输入导航显示的文字' },
                        validate: [{ required: true, message: '名称不能为空', trigger: 'blur' }]
                    },
                    {
                        type: 'radio',
                        field: 'target_type',
                        title: '跳转类型',
                        value: 1,
                        options: [
                            { value: 1, label: '内部页面' },
                            { value: 2, label: '外部链接' }
                        ],
                        // 【联动逻辑核心】：使用 control 属性
                        control: [
                            {
                                value: 1, // 当值为 1 (内部页面) 时
                                rule: [
                                    {
                                        type: 'select',
                                        field: 'page_id',
                                        title: '选择页面',
                                        value: 'home',
                                        options: [
                                            { value: 'home', label: '系统首页' },
                                            { value: 'about', label: '关于我们' },
                                            { value: 'news', label: '新闻中心' }
                                        ]
                                    }
                                ]
                            },
                            {
                                value: 2, // 当值为 2 (外部链接) 时
                                rule: [
                                    {
                                        type: 'input',
                                        field: 'external_url',
                                        title: '链接地址',
                                        value: 'https://',
                                        props: { placeholder: '请输入完整的 URL 地址' },
                                        validate: [{ type: 'url', message: '请输入正确的网址', trigger: 'blur' }]
                                    }
                                ]
                            }
                        ]
                    },
                    {
                        type: 'select',
                        field: 'open_method',
                        title: '打开方式',
                        value: '_self',
                        options: [
                            { value: '_self', label: '当前窗口' },
                            { value: '_blank', label: '新窗口' }
                        ]
                    },
                    {
                        type: 'switch',
                        field: 'is_show',
                        title: '是否显示',
                        value: true
                    }
                ]);

                // 4. 表单全局配置
                const option = reactive({
                    form: {
                        labelWidth: '120px',
                    },
                    submitBtn: {
                        innerText: '保存导航配置',
                        width: '100%'
                    }
                });

                // 提交回调
                const onSubmit = (data) => {
                    alert('配置已保存: ' + JSON.stringify(data));
                    console.log('API 获取的数据:', fApi.value.formData());
                };

                return {
                    fApi,
                    formData,
                    rule,
                    option,
                    onSubmit
                };
            }
        });

        // 注册 form-create
        app.use(formCreate);
        app.use(ElementPlus);
        app.mount('#app');
    </script>
</body>
</html>
