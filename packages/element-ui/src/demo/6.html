<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>form-create 完整后台示例</title>

  <!-- Element Plus -->
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/element-plus"></script>

  <!-- form-create (Vue3 + Element Plus) -->
  <script src="https://unpkg.com/@form-create/element-ui@next"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .page-container {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 200px;
      background: #001529;
      color: #fff;
      padding: 20px;
    }
    .main-content {
      flex: 1;
      padding: 20px;
      background: #f0f2f5;
    }
    .content-section {
      background: #fff;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<div id="app">
  <!-- 完全通过 form-create rule 描述整个页面 -->
  <form-create
    :rule="pageRules"
    :option="{ form: false, submitBtn: false, resetBtn: false }"
  />
</div>

<script>
const { createApp, ref, computed } = Vue

createApp({
  setup () {

    const formApi = ref(null)

    /**
     * 表单提交
     */
    const handleSubmit = (formData) => {
      console.log('表单数据：', formData)
      ElMessage.success('表单提交成功！')
    }

    /**
     * 完整页面规则 - 纯 JSON 格式描述
     */
    const pageRules = ref([
      {
        "type": "div",
        "class": "page-container",
        "children": [
          {
            "type": "div",
            "class": "sidebar",
            "children": [
              {
                "type": "h2",
                "style": { "color": "#fff", "marginBottom": "20px" },
                "children": ["管理后台"]
              },
              {
                "type": "el-menu",
                "props": {
                  "defaultActive": "1",
                  "backgroundColor": "#001529",
                  "textColor": "#fff",
                  "activeTextColor": "#1890ff"
                },
                "children": [
                  {
                    "type": "el-menu-item",
                    "props": { "index": "1" },
                    "children": ["📊 工作台"]
                  },
                  {
                    "type": "el-menu-item",
                    "props": { "index": "2" },
                    "children": ["👥 用户管理"]
                  },
                  {
                    "type": "el-menu-item",
                    "props": { "index": "3" },
                    "children": ["⚙️ 系统设置"]
                  }
                ]
              }
            ]
          },
          {
            "type": "div",
            "class": "main-content",
            "children": [
              {
                "type": "h3",
                "children": ["数据统计"]
              },
              {
                "type": "div",
                "style": { 
                  "display": "grid", 
                  "gridTemplateColumns": "repeat(4, 1fr)", 
                  "gap": "20px", 
                  "marginBottom": "20px" 
                },
                "children": [
                  {
                    "type": "div",
                    "class": "content-section",
                    "children": [
                      {
                        "type": "div",
                        "style": { "fontSize": "14px", "color": "#999" },
                        "children": ["总用户数"]
                      },
                      {
                        "type": "div",
                        "style": { "fontSize": "30px", "fontWeight": "bold", "marginTop": "10px" },
                        "children": ["1,234"]
                      }
                    ]
                  },
                  {
                    "type": "div",
                    "class": "content-section",
                    "children": [
                      {
                        "type": "div",
                        "style": { "fontSize": "14px", "color": "#999" },
                        "children": ["今日订单"]
                      },
                      {
                        "type": "div",
                        "style": { "fontSize": "30px", "fontWeight": "bold", "marginTop": "10px", "color": "#67c23a" },
                        "children": ["89"]
                      }
                    ]
                  },
                  {
                    "type": "div",
                    "class": "content-section",
                    "children": [
                      {
                        "type": "div",
                        "style": { "fontSize": "14px", "color": "#999" },
                        "children": ["营业额"]
                      },
                      {
                        "type": "div",
                        "style": { "fontSize": "30px", "fontWeight": "bold", "marginTop": "10px" },
                        "children": ["¥98,765"]
                      }
                    ]
                  },
                  {
                    "type": "div",
                    "class": "content-section",
                    "children": [
                      {
                        "type": "div",
                        "style": { "fontSize": "14px", "color": "#999" },
                        "children": ["待处理"]
                      },
                      {
                        "type": "div",
                        "style": { "fontSize": "30px", "fontWeight": "bold", "marginTop": "10px", "color": "#e6a23c" },
                        "children": ["12"]
                      }
                    ]
                  }
                ]
              },
              {
                "type": "div",
                "class": "content-section",
                "children": [
                  {
                    "type": "h3",
                    "style": { "marginBottom": "15px" },
                    "children": ["用户列表"]
                  },
                  {
                    "type": "el-table",
                    "props": {
                      "data": [
                        { "id": 1, "name": "张三", "email": "zhangsan@example.com", "status": "激活", "date": "2024-01-01" },
                        { "id": 2, "name": "李四", "email": "lisi@example.com", "status": "禁用", "date": "2024-01-02" },
                        { "id": 3, "name": "王五", "email": "wangwu@example.com", "status": "激活", "date": "2024-01-03" }
                      ],
                      "stripe": true,
                      "border": true
                    },
                    "children": [
                      {
                        "type": "el-table-column",
                        "props": {
                          "prop": "id",
                          "label": "ID",
                          "width": "80"
                        }
                      },
                      {
                        "type": "el-table-column",
                        "props": {
                          "prop": "name",
                          "label": "姓名",
                          "width": "120"
                        }
                      },
                      {
                        "type": "el-table-column",
                        "props": {
                          "prop": "email",
                          "label": "邮箱"
                        }
                      },
                      {
                        "type": "el-table-column",
                        "props": {
                          "prop": "status",
                          "label": "状态",
                          "width": "100"
                        }
                      },
                      {
                        "type": "el-table-column",
                        "props": {
                          "prop": "date",
                          "label": "创建时间",
                          "width": "120"
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "type": "div",
                "class": "content-section",
                "children": [
                  {
                    "type": "h3",
                    "style": { "marginBottom": "15px" },
                    "children": ["新增用户"]
                  },
                  {
                    "type": "input",
                    "field": "username",
                    "title": "用户名",
                    "value": "",
                    "props": {
                      "placeholder": "请输入用户名"
                    },
                    "validate": [{ "required": true, "message": "请输入用户名" }]
                  },
                  {
                    "type": "input",
                    "field": "email",
                    "title": "邮箱",
                    "value": "",
                    "props": {
                      "placeholder": "请输入邮箱"
                    },
                    "validate": [
                      { "required": true, "message": "请输入邮箱" },
                      { "type": "email", "message": "邮箱格式不正确" }
                    ]
                  },
                  {
                    "type": "select",
                    "field": "status",
                    "title": "状态",
                    "value": "激活",
                    "options": [
                      { "label": "激活", "value": "激活" },
                      { "label": "禁用", "value": "禁用" }
                    ]
                  },
                  {
                    "type": "radio",
                    "field": "gender",
                    "title": "性别",
                    "value": "男",
                    "options": [
                      { "label": "男", "value": "男" },
                      { "label": "女", "value": "女" }
                    ]
                  },
                  {
                    "type": "switch",
                    "field": "vip",
                    "title": "VIP会员",
                    "value": false
                  }
                ]
              }
            ]
          }
        ]
      }
    ])

    const formOption = {
      form: {
        labelWidth: '100px'
      },
      submitBtn: {
        innerText: '提交表单'
      }
    }

    return {
      pageRules,
      formApi
    }
  }
})
.use(ElementPlus)
.use(formCreate)
.mount('#app')
</script>
</body>
</html>
